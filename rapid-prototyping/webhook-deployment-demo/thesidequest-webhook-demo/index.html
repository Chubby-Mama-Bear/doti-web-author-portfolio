<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TheSideQuest AI Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>TheSideQuest AI Demo</h1>

  <p>Submit an idea into the AI workflow pipeline.</p>

  <textarea id="ideaInput" placeholder="Enter your idea..."></textarea>

  <br>

  <button onclick="submitIdea()">Submit Idea</button>

  <div id="result"></div>

  <script>
    async function submitIdea() {

      const idea = document.getElementById("ideaInput").value;

      const resultDiv = document.getElementById("result");

      resultDiv.innerHTML = "Processing...";

      try {

        const response = await fetch(
          "http://localhost:5678/webhook-test/idea-submit",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              raw_idea: idea
            })
          }
        );

        const data = await response.json();

        resultDiv.innerHTML =
          "<h3>Workflow Submitted Successfully</h3>" +
          "<pre>" + JSON.stringify(data, null, 2) + "</pre>";

      } catch (error) {

        resultDiv.innerHTML =
          "<h3>Error</h3>" +
          "<pre>" + error + "</pre>";
      }
    }
  </script>

</body>
</html>
